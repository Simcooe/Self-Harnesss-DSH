# h0 — 原生购物 harness 的最小 spine（可编辑面的宿主 profile 的 cordis.patch.yml）。
#
# 这是「精简乙」的最小 spine：只挂购物 agent 真正需要的核心服务，
# 不挂 bash/fs/web/workflow/todo/plan/subagent/skill 等 coding 专属插件。
#
# 可编辑面（shop-tools / instructions / verify-middleware）不在这里 insert，
# 而是由 bundle（@self-harness-dsh/shop-tools 的 cordis.patch.yml）提供——
# 本 profile 的 package.json 里 bundles 列表引用该 bundle。
#
# 这个文件会被 scripts/setup_harness.sh 复制进 $DSH_HOME/profiles/<name>/。

- insert:
    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: !!js process.env.DSH_MODEL ?? 'deepseek-v4-pro'

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        persona: >-
          You are a shopping agent helping a user buy a product on an e-commerce
          site. Search, compare candidates, verify attributes and price, then buy
          the product that satisfies the user's constraints.

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY

    - id: repeat-tool-reminder
      name: '@deepseek-ai/dsh-repeat-tool-reminder'

    - id: timeout-policy
      name: '@deepseek-ai/dsh-tool-call-timeout-policy'

    - id: headless-startup
      name: '@deepseek-ai/dsh-headless/startup'

    - id: headless-runner
      name: '@deepseek-ai/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
